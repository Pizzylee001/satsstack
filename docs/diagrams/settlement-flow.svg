<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="100%" height="100%" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">SatsStack Architecture and Settlement Flow</title>
  <desc id="diagramDesc">Flow diagram showing MUSD deposit into SatsStackVault, idle parking in sMUSD (MUSDSavingsRate), TroveManager ICR safety check before tranche withdrawal, Tigris AMM swap into native BTC, and exit via claimBtc or routeBtcToTrove.</desc>

  <style>
    :root {
      --bg-canvas: #0E1116;
      --bg-surface: #181D24;
      --border-default: #262E3B;
      --fg-default: #F0F4F8;
      --fg-muted: #8B95A5;
      --accent-amber: #F59E0B;
      --accent-emerald: #10B981;
      --accent-danger: #EF4444;
      --accent-info: #3B82F6;
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', Menlo, monospace;
    }
    svg {
      background-color: var(--bg-canvas);
      font-family: var(--font-body);
    }
    .title {
      fill: var(--fg-default);
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      fill: var(--fg-muted);
      font-size: 14px;
      font-weight: 400;
    }
    .node-box {
      fill: var(--bg-surface);
      stroke: var(--border-default);
      stroke-width: 1.5;
    }
    .node-box-amber {
      fill: var(--bg-surface);
      stroke: var(--accent-amber);
      stroke-width: 2;
    }
    .node-box-emerald {
      fill: var(--bg-surface);
      stroke: var(--accent-emerald);
      stroke-width: 1.5;
    }
    .node-box-info {
      fill: var(--bg-surface);
      stroke: var(--accent-info);
      stroke-width: 1.5;
    }
    .node-box-danger {
      fill: var(--bg-surface);
      stroke: var(--accent-danger);
      stroke-width: 1.5;
    }
    .node-title {
      fill: var(--fg-default);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
    }
    .node-title-amber {
      fill: var(--accent-amber);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
    }
    .node-title-emerald {
      fill: var(--accent-emerald);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
    }
    .node-title-info {
      fill: var(--accent-info);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
    }
    .node-title-danger {
      fill: var(--accent-danger);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
    }
    .node-body {
      fill: var(--fg-default);
      font-size: 13px;
    }
    .node-muted {
      fill: var(--fg-muted);
      font-size: 13px;
    }
    .node-mono {
      fill: var(--accent-amber);
      font-family: var(--font-mono);
      font-size: 12.5px;
    }
    .node-mono-muted {
      fill: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .edge-label {
      fill: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .edge-ok {
      fill: var(--accent-emerald);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
    }
    .edge-abort {
      fill: var(--accent-danger);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
    }
    .divider {
      stroke: var(--border-default);
      stroke-width: 1;
    }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#262E3B" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#10B981" />
    </marker>
    <marker id="arrowDanger" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#EF4444" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#8B95A5" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0E1116" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" class="title">SatsStack On-Chain Settlement Architecture</text>
    <text x="0" y="24" class="subtitle">Verified execution order in SatsStackVault.sol on Mezo Testnet (Chain ID 31611)</text>
  </g>

  <!-- Connectors -->
  <!-- 1. Depositor -> SatsStackVault -->
  <path d="M 228 256 L 280 256" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)" />
  <text x="234" y="244" class="edge-label">MUSD</text>

  <!-- 2. SatsStackVault <-> sMUSD (Idle yield & tranche pull) -->
  <path d="M 352 192 L 352 96 L 578 96" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <text x="366" y="86" class="edge-ok">deposit(budget)</text>

  <path d="M 584 128 L 434 128 L 434 184" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowEmerald)" />
  <text x="444" y="150" class="edge-label">withdraw(tranche)</text>

  <!-- 3. Owner or Keeper -> SatsStackVault -->
  <path d="M 384 424 L 384 350" fill="none" stroke="#8B95A5" stroke-width="2" marker-end="url(#arrowMuted)" />
  <text x="394" y="388" class="edge-label">executeTranche()</text>

  <!-- 4. SatsStackVault -> Trove Safety Check -->
  <path d="M 500 256 L 578 256" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)" />

  <!-- 5. TroveManager -> Trove Safety Check -->
  <path d="M 702 424 L 702 330" fill="none" stroke="#8B95A5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)" />
  <text x="712" y="380" class="edge-label">getCurrentICR()</text>

  <!-- 6. Trove Safety Check -> Swap Aborted (via clear corridor x=552) -->
  <path d="M 624 322 L 624 354 L 552 354 L 552 550" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowDanger)" />
  <text x="562" y="542" class="edge-abort">ICR &lt; floor</text>

  <!-- 7. Trove Safety Check -> Tigris AMM Swap -->
  <path d="M 800 256 L 870 256" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <text x="808" y="244" class="edge-ok">ICR ok</text>

  <!-- 8. Tigris AMM Swap -> Settlement exits -->
  <path d="M 984 316 L 984 366 L 948 366 L 948 408" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <text x="870" y="394" class="edge-ok">claim</text>

  <path d="M 1038 316 L 1038 366 L 1110 366 L 1110 520" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)" />
  <text x="1118" y="454" class="edge-label">addColl</text>

  <!-- Node 1: Depositor -->
  <g transform="translate(48, 200)">
    <rect width="180" height="116" rx="8" class="node-box" />
    <line x1="12" y1="2" x2="168" y2="2" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <text x="16" y="32" class="node-title">Depositor</text>
    <text x="16" y="56" class="node-muted">Calls createPlan()</text>
    <text x="16" y="78" class="node-body">Sets budget, tranche,</text>
    <text x="16" y="96" class="node-body">cadence, and ICR floor</text>
  </g>

  <!-- Node 2: SatsStackVault -->
  <g transform="translate(288, 192)">
    <rect width="212" height="150" rx="8" class="node-box-amber" />
    <text x="16" y="32" class="node-title-amber">SatsStackVault</text>
    <text x="16" y="52" class="node-mono-muted">0x9f2f...26b6</text>
    <line x1="16" y1="64" x2="196" y2="64" class="divider" />
    <text x="16" y="86" class="node-body">Owns plan state</text>
    <text x="16" y="106" class="node-body">Parks MUSD in sMUSD</text>
    <text x="16" y="126" class="node-body">Holds stacked BTC</text>
  </g>

  <!-- Node 3: sMUSD (MUSDSavingsRate) -->
  <g transform="translate(584, 58)">
    <rect width="268" height="84" rx="8" class="node-box-emerald" />
    <text x="16" y="29" class="node-title-emerald">sMUSD (MUSDSavingsRate)</text>
    <text x="16" y="49" class="node-mono-muted">0x6f46...8e16</text>
    <text x="16" y="69" class="node-body">Earns yield while tranches wait</text>
  </g>

  <!-- Node 4: Owner or Keeper -->
  <g transform="translate(274, 424)">
    <rect width="236" height="92" rx="8" class="node-box" />
    <text x="16" y="30" class="node-title">Owner or Keeper</text>
    <text x="16" y="52" class="node-muted">Permissionless timing trigger</text>
    <text x="16" y="74" class="node-mono">nextExecutionTime &lt;= now</text>
  </g>

  <!-- Node 5: Trove Safety Check -->
  <g transform="translate(584, 194)">
    <rect width="216" height="128" rx="8" class="node-box-amber" />
    <text x="16" y="30" class="node-title-amber">1. Trove Safety Check</text>
    <text x="16" y="50" class="node-muted">Runs before swap</text>
    <line x1="16" y1="62" x2="200" y2="62" class="divider" />
    <text x="16" y="84" class="node-body">Queries checkTroveIcr()</text>
    <text x="16" y="106" class="node-body">Blocks buy if ICR &lt; floor</text>
  </g>

  <!-- Node 6: TroveManager + PriceFeed -->
  <g transform="translate(592, 424)">
    <rect width="224" height="92" rx="8" class="node-box" />
    <text x="16" y="30" class="node-title">TroveManager + PriceFeed</text>
    <text x="16" y="52" class="node-mono-muted">0xE47c...6bb0</text>
    <text x="16" y="74" class="node-muted">Oracle: 0x86bC...9366</text>
  </g>

  <!-- Node 7: Swap Aborted (TroveUnsafe) -->
  <g transform="translate(432, 558)">
    <rect width="276" height="84" rx="8" class="node-box-danger" />
    <text x="16" y="29" class="node-title-danger">Swap Aborted (TroveUnsafe)</text>
    <text x="16" y="51" class="node-body">Reverts before withdrawing sMUSD;</text>
    <text x="16" y="69" class="node-muted">MUSD stays parked earning yield</text>
  </g>

  <!-- Node 8: Tigris AMM Swap -->
  <g transform="translate(878, 198)">
    <rect width="276" height="116" rx="8" class="node-box-info" />
    <text x="16" y="30" class="node-title-info">2. Tigris AMM Swap</text>
    <text x="16" y="50" class="node-mono-muted">Router 0x9a1f...D7E9</text>
    <line x1="16" y1="62" x2="260" y2="62" class="divider" />
    <text x="16" y="84" class="node-body">Basic MUSD/BTC Pool (0xd16A...6AA9)</text>
    <text x="16" y="104" class="node-body">Swaps MUSD -&gt; Native BTC (0x7b7C...)</text>
  </g>

  <!-- Node 9A: Wallet Claim -->
  <g transform="translate(854, 416)">
    <rect width="210" height="86" rx="8" class="node-box-emerald" />
    <text x="16" y="30" class="node-title-emerald">Exit A: Wallet Claim</text>
    <text x="16" y="52" class="node-mono">claimBtc(planId, to)</text>
    <text x="16" y="72" class="node-muted">Transfers native BTC out</text>
  </g>

  <!-- Node 9B: Trove Collateral Top-Up -->
  <g transform="translate(924, 528)">
    <rect width="234" height="106" rx="8" class="node-box-amber" />
    <text x="16" y="30" class="node-title-amber">Exit B: Trove Collateral</text>
    <text x="16" y="52" class="node-mono">routeBtcToTrove(planId)</text>
    <text x="16" y="74" class="node-body">BorrowerOperations.addColl()</text>
    <text x="16" y="92" class="node-muted">Raises Trove ICR buffer</text>
  </g>
</svg>
