<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background-color: #0E1116; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Technical Background Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#262E3B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Subtle hardware illumination glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0E1116" stop-opacity="0" />
    </radialGradient>

    <!-- Markers -->
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#06B6D4" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5A6474" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0E1116" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect width="100%" height="320" fill="url(#topGlow)" />

  <!-- Title Block -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" fill="#F0F4F8" font-size="22" font-weight="700" letter-spacing="-0.02em" font-family="'Space Grotesk', sans-serif">
      SatsStack Architecture &amp; Settlement Flow
    </text>
    <text x="0" y="24" fill="#8B95A5" font-size="13" font-weight="400">
      Yield-bearing capital accumulation with automated Tigris AMM execution and Trove liquidation protection
    </text>
  </g>

  <!-- Flow Line Highlights -->
  <!-- 1. Depositor to Vault -->
  <path d="M 210 230 L 260 230" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowGold)" />
  
  <!-- 2. Vault to sMUSD (Idle Yield) -->
  <path d="M 400 210 L 400 155 L 460 155" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <path d="M 460 175 L 420 175 L 420 220" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowEmerald)" />

  <!-- 3. Keeper Trigger -->
  <path d="M 330 380 L 330 270" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- 4. Vault to Tigris Swap -->
  <path d="M 470 240 L 540 240" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- 5. Tigris Swap to Trove ICR Safety Circuit -->
  <path d="M 720 240 L 780 240" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- 6. Safety Circuit Fork: Leg A (Native BTC Claim) -->
  <path d="M 960 225 L 1010 225 L 1010 165 L 1040 165" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- 7. Safety Circuit Fork: Leg B (Trove Collateral Top-Up) -->
  <path d="M 960 255 L 1010 255 L 1010 325 L 1040 325" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- 8. Safety Circuit Inspection query from TroveManager -->
  <path d="M 870 380 L 870 280" fill="none" stroke="#5A6474" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)" />

  <!-- NODE 1: User / Depositor -->
  <g transform="translate(60, 180)">
    <rect width="150" height="100" rx="8" fill="#181D24" stroke="#262E3B" stroke-width="1.5" />
    <rect width="150" height="4" rx="2" fill="#F59E0B" />
    <text x="16" y="32" fill="#F0F4F8" font-size="14" font-weight="600">User / Depositor</text>
    <text x="16" y="54" fill="#8B95A5" font-size="12">Deposits MUSD</text>
    <text x="16" y="74" fill="#F59E0B" font-size="12" font-family="'JetBrains Mono', monospace">Plan Budget</text>
  </g>

  <!-- NODE 2: SatsStackVault Core -->
  <g transform="translate(260, 160)">
    <rect width="210" height="130" rx="8" fill="#181D24" stroke="#F59E0B" stroke-width="2" />
    <rect width="210" height="4" rx="2" fill="url(#goldGrad)" />
    <text x="16" y="32" fill="#F0F4F8" font-size="15" font-weight="700">SatsStackVault</text>
    <text x="16" y="52" fill="#8B95A5" font-size="12">0x9f2f...26b6 (Chain 31611)</text>
    <line x1="16" y1="62" x2="194" y2="62" stroke="#262E3B" stroke-width="1" />
    <text x="16" y="80" fill="#F0F4F8" font-size="12">• Manages Tranche Schedule</text>
    <text x="16" y="98" fill="#F0F4F8" font-size="12">• Routes Idle Funds to sMUSD</text>
    <text x="16" y="116" fill="#F0F4F8" font-size="12">• Enforces ICR Safety Rules</text>
  </g>

  <!-- NODE 3: sMUSD Savings Vault (Yield) -->
  <g transform="translate(460, 110)">
    <rect width="210" height="90" rx="8" fill="#181D24" stroke="#10B981" stroke-width="1.5" />
    <text x="16" y="28" fill="#10B981" font-size="14" font-weight="600">sMUSD Savings Vault</text>
    <text x="16" y="48" fill="#8B95A5" font-size="12">ERC-4626 Yield Accrual</text>
    <text x="16" y="68" fill="#F0F4F8" font-size="12">Idle capital compounds yield</text>
  </g>

  <!-- NODE 4: Keeper / Automation Trigger -->
  <g transform="translate(260, 380)">
    <rect width="210" height="85" rx="8" fill="#181D24" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="16" y="28" fill="#A78BFA" font-size="14" font-weight="600">Cadence Trigger / Keeper</text>
    <text x="16" y="48" fill="#8B95A5" font-size="12">Permissionless Automation</text>
    <text x="16" y="68" fill="#F0F4F8" font-size="12">Calls executeTranche()</text>
  </g>

  <!-- NODE 5: Tigris Basic MUSD/BTC Pool -->
  <g transform="translate(540, 195)">
    <rect width="180" height="90" rx="8" fill="#181D24" stroke="#06B6D4" stroke-width="1.5" />
    <text x="16" y="28" fill="#06B6D4" font-size="14" font-weight="600">Tigris AMM Swap</text>
    <text x="16" y="48" fill="#8B95A5" font-size="12">Basic MUSD/BTC Pool</text>
    <text x="16" y="68" fill="#F0F4F8" font-size="12">MUSD Swapped for BTC</text>
  </g>

  <!-- NODE 6: Trove ICR Safety Circuit -->
  <g transform="translate(780, 185)">
    <rect width="180" height="105" rx="8" fill="#181D24" stroke="#F59E0B" stroke-width="1.5" />
    <text x="16" y="28" fill="#F59E0B" font-size="14" font-weight="600">ICR Safety Circuit</text>
    <text x="16" y="48" fill="#8B95A5" font-size="12">Pre-Execution Safety Check</text>
    <line x1="16" y1="58" x2="164" y2="58" stroke="#262E3B" stroke-width="1" />
    <text x="16" y="74" fill="#10B981" font-size="11">ICR &gt;= Target: Healthy</text>
    <text x="16" y="92" fill="#EF4444" font-size="11">ICR &lt; Target: Liquidation Risk</text>
  </g>

  <!-- NODE 7: Mezo TroveManager -->
  <g transform="translate(780, 380)">
    <rect width="180" height="85" rx="8" fill="#181D24" stroke="#262E3B" stroke-width="1.5" />
    <text x="16" y="28" fill="#8B95A5" font-size="14" font-weight="600">TroveManager</text>
    <text x="16" y="48" fill="#5A6474" font-size="12">Mezo Debt Protocol</text>
    <text x="16" y="68" fill="#F0F4F8" font-size="12">Returns current Trove ICR</text>
  </g>

  <!-- NODE 8A: Fork Option A - Depositor BTC Claim -->
  <g transform="translate(1040, 115)">
    <rect width="200" height="90" rx="8" fill="#181D24" stroke="#10B981" stroke-width="1.5" />
    <text x="16" y="28" fill="#10B981" font-size="14" font-weight="600">Native BTC Accumulation</text>
    <text x="16" y="48" fill="#8B95A5" font-size="12">Standard DCA Destination</text>
    <text x="16" y="68" fill="#F0F4F8" font-size="12">claimBtc() to Depositor</text>
  </g>

  <!-- NODE 8B: Fork Option B - Trove Collateral Injection -->
  <g transform="translate(1040, 275)">
    <rect width="200" height="95" rx="8" fill="#181D24" stroke="#F59E0B" stroke-width="1.5" />
    <text x="16" y="28" fill="#F59E0B" font-size="14" font-weight="600">BorrowerOperations</text>
    <text x="16" y="48" fill="#8B95A5" font-size="12">addColl() Auto-Top-Up</text>
    <line x1="16" y1="58" x2="184" y2="58" stroke="#262E3B" stroke-width="1" />
    <text x="16" y="74" fill="#10B981" font-size="12">Restores Trove ICR Floor</text>
  </g>

  <!-- Legend and Verification Footer -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="70" rx="6" fill="#111827" stroke="#262E3B" stroke-width="1" />
    <text x="24" y="28" fill="#8B95A5" font-size="12" font-weight="600">SETTLEMENT PROTOCOL LEGEND</text>
    
    <circle cx="28" cy="48" r="5" fill="#F59E0B" />
    <text x="40" y="52" fill="#F0F4F8" font-size="12">MUSD Capital Flow</text>

    <circle cx="200" cy="48" r="5" fill="#10B981" />
    <text x="212" y="52" fill="#F0F4F8" font-size="12">sMUSD Yield &amp; BTC Payout</text>

    <circle cx="410" cy="48" r="5" fill="#06B6D4" />
    <text x="422" y="52" fill="#F0F4F8" font-size="12">Tigris AMM Swap Route</text>

    <circle cx="610" cy="48" r="5" fill="#8B5CF6" />
    <text x="622" y="52" fill="#F0F4F8" font-size="12">Keeper Cadence Trigger</text>

    <circle cx="820" cy="48" r="5" fill="#5A6474" />
    <text x="832" y="52" fill="#F0F4F8" font-size="12">On-Chain State Query</text>
  </g>
</svg>
